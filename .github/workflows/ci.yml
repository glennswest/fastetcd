name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }} / ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        features: ["", "wal-engine"]
        include:
          - os: ubuntu-latest
            features: "iouring"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.7
      - name: install protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: cargo test (workspace)
        if: matrix.features == ''
        run: cargo test --workspace --no-fail-fast
      - name: cargo test (features=${{ matrix.features }})
        if: matrix.features != ''
        run: cargo test -p fastetcd-storage --features ${{ matrix.features }} --no-fail-fast

  build-linux-binary:
    name: build release Linux binary
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.7.7
      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: cargo build --release -p fastetcd-server
        run: cargo build --release -p fastetcd-server --bin fastetcd
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: fastetcd-linux-x86_64
          path: target/release/fastetcd
          if-no-files-found: error

  build-container:
    name: build & push container
    runs-on: ubuntu-latest
    needs: [build-linux-binary]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fastetcd-linux-x86_64
          path: ./
      - run: chmod +x ./fastetcd
      - name: login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  build-packages:
    name: build & publish rpm/deb/tarball
    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2.7.7
      - name: install protoc + musl-tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler musl-tools
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      # Static-pie musl binaries: no glibc-version dependency on
      # whatever distro installs the resulting rpm/deb.
      - name: cargo build --release --workspace (musl)
        run: cargo build --release --workspace --target x86_64-unknown-linux-musl
      - name: cargo deb
        run: |
          mkdir -p target/debian
          cargo deb -p fastetcd-server --no-build --target x86_64-unknown-linux-musl -o target/debian/
      - name: cargo generate-rpm
        run: |
          mkdir -p target/generate-rpm
          cargo generate-rpm -p crates/server -o target/generate-rpm/
      - name: build static-binary tarball
        run: |
          ver="${{ github.ref_name }}"
          dir="fastetcd-${ver}-x86_64-linux"
          mkdir -p "dist/$dir"
          cp target/x86_64-unknown-linux-musl/release/fastetcd \
             target/x86_64-unknown-linux-musl/release/fastetcd-ctl \
             target/x86_64-unknown-linux-musl/release/fastetcd-migrate \
             deploy/systemd/fastetcd.service \
             deploy/systemd/fastetcd.conf.example \
             README.md \
             "dist/$dir/"
          tar czf "dist/fastetcd-${ver}-x86_64-linux-musl.tar.gz" -C dist "$dir"
      - name: checksums
        run: |
          cd dist
          mv ../target/debian/*.deb ../target/generate-rpm/*.rpm .
          sha256sum *.deb *.rpm *.tar.gz > SHA256SUMS.txt
      - name: publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          generate_release_notes: true
