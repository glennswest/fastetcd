replicaCount: 3

image:
  repository: ghcr.io/glennswest/fastetcd
  tag: ""           # defaults to .Chart.appVersion if empty
  pullPolicy: IfNotPresent

# Cluster bootstrap. Each replica gets a stable name node-0/1/2 etc.
# `--initial-cluster` is computed from these.
cluster:
  state: new        # new | existing
  # Override the auto-generated --initial-cluster string by
  # setting this to a non-empty value.
  override: ""

ports:
  client: 2379
  peer: 2380
  metrics: 2381

persistence:
  enabled: true
  storageClass: ""
  # Size this against the cluster, not against the data: a raft snapshot
  # is a full copy of the database, so the volume runs ~10x the live
  # Kubernetes objects. `fastetcd sizing --nodes N` prints the
  # arithmetic. At default pod density: 512Mi for 1-10 nodes, 1Gi at
  # 100, 2Gi at 500, 4Gi at 1000. 10Gi covers a large cluster with room
  # to spare; set `space.expectedNodes` below to have the server check
  # this at startup.
  size: 10Gi

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

service:
  type: ClusterIP

serviceMonitor:
  enabled: false   # set true if the Prometheus operator is installed

tls:
  enabled: false
  # When enabled, a Secret with the keys below must already exist.
  # Mounted into /etc/fastetcd/tls. clientCertAuth requires
  # caFile to be set.
  secretName: ""
  certFile: tls.crt
  keyFile: tls.key
  caFile: ""
  clientCertAuth: false

# Disk space management (see docs/04-disk-space.md). fastetcd measures
# the PVC's real free space, reclaims at the high-water mark (compact ->
# snapshot -> purge -> defragment) and raises a NOSPACE alarm at the
# alarm mark, where writes are refused but reads, deletes, compaction
# and defragment keep working. Defaults suit a normally-sized volume;
# tighten highWaterPercent on a small one so reclaim starts earlier.
space:
  # Ceiling on the store's footprint in bytes. 0 = the volume is the
  # limit, which is what you want with `persistence.size` set.
  quotaBackendBytes: 0
  highWaterPercent: 80
  alarmPercent: 95
  clearPercent: 70
  checkIntervalSecs: 30
  # Revisions of MVCC history kept when compacting under pressure.
  reclaimRetention: 1000
  autoDefrag: true
  # Snapshots retained on disk. Each is a full copy of the database.
  maxSnapshots: 1
  # Nodes this cluster will run. When set, the server checks
  # persistence.size against its sizing model at startup and warns if
  # the volume is too small — while the store is still empty and the
  # answer is actionable. 0 disables the check.
  expectedNodes: 0
  # Average pods per node; this term dominates the estimate.
  expectedPodsPerNode: 30

extraArgs: []     # extra CLI flags passed verbatim to fastetcd
