apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: fastetcd
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ .Release.Name }}-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: fastetcd
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fastetcd
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: fastetcd
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: FASTETCD_INITIAL_CLUSTER_STATE
              value: {{ .Values.cluster.state | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              CLUSTER='{{ .Values.cluster.override }}'
              if [ -z "$CLUSTER" ]; then
                CLUSTER=""
                for i in $(seq 0 $(({{ .Values.replicaCount }} - 1))); do
                  n="{{ .Release.Name }}-$i"
                  e="{{ if .Values.peerTls.enabled }}https{{ else }}http{{ end }}://$n.{{ .Release.Name }}-headless.$POD_NAMESPACE.svc:{{ .Values.ports.peer }}"
                  if [ -z "$CLUSTER" ]; then CLUSTER="$n=$e"; else CLUSTER="$CLUSTER,$n=$e"; fi
                done
              fi
              exec /usr/local/bin/fastetcd \
                --name="$POD_NAME" \
                --data-dir=/var/lib/fastetcd \
                --listen-client-url=0.0.0.0:{{ .Values.ports.client }} \
                --listen-peer-url=0.0.0.0:{{ .Values.ports.peer }} \
                --listen-metrics-url=0.0.0.0:{{ .Values.ports.metrics }} \
                --initial-cluster="$CLUSTER" \
                --initial-cluster-state="$FASTETCD_INITIAL_CLUSTER_STATE" \
                {{- if .Values.tls.enabled }}
                --cert-file=/etc/fastetcd/tls/{{ .Values.tls.certFile }} \
                --key-file=/etc/fastetcd/tls/{{ .Values.tls.keyFile }} \
                {{- if .Values.tls.caFile }}
                --trusted-ca-file=/etc/fastetcd/tls/{{ .Values.tls.caFile }} \
                {{- end }}
                {{- if .Values.tls.clientCertAuth }}
                --client-cert-auth \
                {{- end }}
                {{- end }}
                {{- if .Values.peerTls.enabled }}
                --peer-cert-file=/etc/fastetcd/peer-tls/{{ .Values.peerTls.certFile }} \
                --peer-key-file=/etc/fastetcd/peer-tls/{{ .Values.peerTls.keyFile }} \
                --peer-trusted-ca-file=/etc/fastetcd/peer-tls/{{ .Values.peerTls.caFile | required "peerTls.caFile required when peerTls.enabled" }} \
                {{- if .Values.peerTls.clientCertAuth }}
                --peer-client-cert-auth \
                {{- end }}
                {{- end }}
                {{- with .Values.space }}
                --quota-backend-bytes={{ .quotaBackendBytes }} \
                --space-high-water-percent={{ .highWaterPercent }} \
                --space-alarm-percent={{ .alarmPercent }} \
                --space-clear-percent={{ .clearPercent }} \
                --space-check-interval-secs={{ .checkIntervalSecs }} \
                --space-reclaim-retention={{ .reclaimRetention }} \
                --auto-defrag={{ .autoDefrag }} \
                --max-snapshots={{ .maxSnapshots }} \
                {{- if gt (int .expectedNodes) 0 }}
                --expected-nodes={{ .expectedNodes }} \
                --expected-pods-per-node={{ .expectedPodsPerNode }} \
                {{- end }}
                {{- end }}
                {{- range .Values.extraArgs }}
                {{ . }} \
                {{- end }}
          ports:
            - name: client
              containerPort: {{ .Values.ports.client }}
            - name: peer
              containerPort: {{ .Values.ports.peer }}
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
          # etcd's split (#69): ready means leader, quorum read and no
          # CORRUPT alarm; live means this member can serve a local read,
          # so a partition does not get members restarted.
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.ports.client }}
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.ports.client }}
              {{- if .Values.tls.enabled }}
              scheme: HTTPS
              {{- end }}
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/fastetcd
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/fastetcd/tls
              readOnly: true
            {{- end }}
            {{- if .Values.peerTls.enabled }}
            - name: peer-tls
              mountPath: /etc/fastetcd/peer-tls
              readOnly: true
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName | required "tls.secretName required when tls.enabled" }}
        {{- end }}
        {{- if .Values.peerTls.enabled }}
        - name: peer-tls
          secret:
            secretName: {{ .Values.peerTls.secretName | required "peerTls.secretName required when peerTls.enabled" }}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
