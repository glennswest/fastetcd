syntax = "proto3";
package fastetcd.raft;

// Internal-only RPC service used for openraft peer communication.
// Not part of the etcd v3 wire protocol; fastetcd peers serve and
// dial this on the peer-URL endpoint (default port 2380).
//
// Payloads are opaque bincode-serialized openraft request/response
// structs. We deliberately do NOT model the openraft messages in
// protobuf — they evolve with the openraft crate and bincode tracks
// that without us having to vendor and regenerate stubs every bump.

service RaftPeer {
    rpc AppendEntries(RaftPayload) returns (RaftPayload);
    rpc Vote(RaftPayload) returns (RaftPayload);
    rpc InstallSnapshot(RaftPayload) returns (RaftPayload);

    // A node that isn't the leader hands a client write off to
    // whichever node is, over this same peer channel — reusing the
    // address fastetcd already resolves correctly for AppendEntries
    // (see network.rs) rather than needing a separate client-URL
    // exchange between members.
    rpc ForwardWrite(RaftPayload) returns (RaftPayload);

    // Same hand-off for cluster membership changes. etcd forwards
    // MemberAdd/MemberRemove to the leader transparently, so etcdctl
    // and friends work against any endpoint; fastetcd used to surface
    // openraft's ForwardToLeader error to the caller instead (#7).
    rpc ForwardMembership(RaftPayload) returns (RaftPayload);

    // Linearizable read served on the leader. A follower can't
    // establish a read-index by itself, so a default (non-serializable)
    // Range it receives is forwarded here; the leader confirms
    // leadership (ReadIndex), waits for its state machine to catch up,
    // and reads — so the result never lags a completed write (#10).
    rpc ForwardRead(RaftPayload) returns (RaftPayload);
}

message RaftPayload {
    bytes data = 1;
}
