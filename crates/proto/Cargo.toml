[package]
name = "fastetcd-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Generated etcd v3 gRPC stubs (tonic + prost) for fastetcd."

[lib]
path = "src/lib.rs"

[dependencies]
tonic.workspace = true
prost.workspace = true
prost-types.workspace = true
# JSON for etcd's v3 gateway (#28): serde impls generated by pbjson-build
# following the proto3 JSON mapping, as etcd's grpc-gateway emits it.
pbjson = "0.7"
serde.workspace = true

[build-dependencies]
tonic-build.workspace = true
pbjson-build = "0.7"
