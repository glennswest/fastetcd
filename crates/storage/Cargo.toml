[package]
name = "fastetcd-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Storage layer for fastetcd: KvStore trait + engines (redb + io_uring) + MVCC state machine."

[lib]
path = "src/lib.rs"

[features]
# `redb` is default and cross-platform.
default = ["redb-engine"]
redb-engine = ["dep:redb"]
# Expose the trait-level conformance test suite to downstream engines
# (used by integration tests and any future engine crate).
conformance = []

[dependencies]
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
bincode.workspace = true
thiserror.workspace = true
bytes.workspace = true
tracing.workspace = true
sha2.workspace = true

redb = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# `statvfs`, for the data directory's filesystem free-space probe
# (fastetcd#14). Present on every unix target we build for — Linux and
# macOS both — so this is not a Linux-only dependency.
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3.13"
criterion.workspace = true

[[bench]]
name = "mvcc"
harness = false
