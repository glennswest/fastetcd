[package]
name = "fastetcd-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Storage layer for fastetcd: KvStore trait + engines (redb + io_uring) + MVCC state machine."

[lib]
path = "src/lib.rs"

[features]
# `redb` is default and cross-platform.
default = ["redb-engine"]
redb-engine = ["dep:redb"]
# `wal-engine` is the WAL + in-memory-index engine. Cross-platform
# using tokio fs today; the production `iouring` backend swaps the
# file I/O layer for glommio + O_DIRECT below this same engine.
wal-engine = []
# `iouring` is the Linux-only kernel-bypass file I/O backend.
# Implemented as a dedicated OS thread running `tokio_uring::start`,
# bridged to the main tokio runtime via mpsc channels. Architecture
# above the file-I/O layer mirrors `wal-engine`: append-only WAL +
# in-memory MVCC index.
iouring = ["dep:tokio-uring", "wal-engine"]
# Expose the trait-level conformance test suite to downstream engines
# (used by integration tests and any future engine crate).
conformance = []

[dependencies]
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
bincode.workspace = true
thiserror.workspace = true
bytes.workspace = true
tracing.workspace = true
sha2.workspace = true

redb = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# tokio-uring is Linux-only; the iouring engine is gated behind the
# `iouring` feature *and* the target-os filter so non-Linux builds
# never try to compile the io-uring crate (which depends on Linux
# syscalls).
tokio-uring = { version = "0.5", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3.13"
criterion.workspace = true

[[bench]]
name = "mvcc"
harness = false
