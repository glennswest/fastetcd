[package]
name = "fastetcd-migrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Import an etcd v3 BoltDB snapshot into fastetcd."

[lib]
path = "src/lib.rs"

[[bin]]
name = "fastetcd-migrate"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
prost.workspace = true
sha2.workspace = true

fastetcd-storage.workspace = true
fastetcd-proto.workspace = true

[dev-dependencies]
# Writes the tests' BoltDB fixtures. Reading is crate::bolt: bbolt-rs cannot
# open etcd's files (no freelist, #60). `compat`: Go bbolt's magic number,
# which etcd's files carry; without it bbolt-rs writes its own.
bbolt-rs = { version = "1.3", features = ["compat"] }
tempfile = "3.13"
bcrypt = "0.15"
bincode.workspace = true
