[package]
name = "fastetcd-migrate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Import an etcd v3 BoltDB snapshot into fastetcd."

[lib]
path = "src/lib.rs"

[[bin]]
name = "fastetcd-migrate"
path = "src/main.rs"

[dependencies]
clap.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
prost.workspace = true
# `compat`: Go bbolt's magic number (0xED0CDAED), which etcd's files carry.
# Without it bbolt-rs writes and accepts only its own (0x5caff01d), so no
# real etcd snapshot could be read (#60).
bbolt-rs = { version = "1.3", features = ["compat"] }
sha2.workspace = true

fastetcd-storage.workspace = true
fastetcd-proto.workspace = true

[dev-dependencies]
tempfile = "3.13"
bcrypt = "0.15"
bincode.workspace = true
