[package]
name = "fastetcd-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "fastetcd server binary: gRPC frontend + Raft node + storage."

[[bin]]
name = "fastetcd"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
tonic.workspace = true
prost.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
openraft.workspace = true

fastetcd-proto.workspace = true
fastetcd-storage.workspace = true
fastetcd-raft.workspace = true

sha2.workspace = true
bincode.workspace = true
argon2.workspace = true
rand.workspace = true

[dev-dependencies]
tempfile = "3.13"
# Third-party etcd v3 client crate — used to validate wire
# compatibility against an external client that doesn't share any
# code with fastetcd. If this client's API works against fastetcd,
# real etcd consumers will too.
etcd-client = "0.18"
