[package]
name = "fastetcd-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "fastetcd server binary: gRPC frontend + Raft node + storage."

[[bin]]
name = "fastetcd"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
tonic.workspace = true
tonic-health = "0.12"
prost.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
openraft.workspace = true

fastetcd-proto.workspace = true
fastetcd-storage.workspace = true
fastetcd-raft.workspace = true

sha2.workspace = true
bincode.workspace = true
argon2.workspace = true
rand.workspace = true
rustls-pemfile = "2.2"
prometheus-client = "0.22"
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
# Must track the axum version tonic 0.12 embeds internally
# (tonic::service::Routes converts to/from axum::Router) so the
# client-port /health route below shares its type.
axum = "0.7"

[dev-dependencies]
tempfile = "3.13"
# Third-party etcd v3 client crate — used to validate wire
# compatibility against an external client that doesn't share any
# code with fastetcd. If this client's API works against fastetcd,
# real etcd consumers will too.
etcd-client = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# ---------------------------------------------------------------
# Packaging (cargo-deb / cargo-generate-rpm). Built with:
#   cargo build --release --workspace --target x86_64-unknown-linux-musl
#   cargo deb -p fastetcd-server --no-build --target x86_64-unknown-linux-musl
#   cargo generate-rpm -p crates/server --target x86_64-unknown-linux-musl
# Bundles all three binaries (server, ctl, migrate) plus the
# systemd unit under the single "fastetcd" package name.
#
# Binaries are built against musl (static-pie, zero dynamic libs —
# verified with `ldd`/`file`) rather than glibc specifically so the
# same package installs on any x86_64 Linux regardless of the host
# glibc version: a glibc-linked build on this box's Fedora 43 would
# bake in symbol versions (e.g. recent GLIBC_2.4x) newer than what
# ships on common Debian/Ubuntu LTS targets, breaking the .deb on
# exactly the systems it's meant for.
#
# Asset/script paths differ between the two tools: cargo-deb
# resolves them relative to this crate's manifest dir (hence the
# `../../`), cargo-generate-rpm relative to the invocation cwd
# (workspace root).
# ---------------------------------------------------------------

[package.metadata.deb]
name = "fastetcd"
maintainer = "fastetcd contributors"
copyright = "2026, fastetcd contributors"
extended-description = """\
fastetcd is a Rust implementation of the etcd v3 wire protocol, \
wire-compatible with unmodified etcd v3 gRPC clients. Multi-node \
Raft consensus (openraft) from the start, pluggable storage \
engines (redb / io_uring), and predictable low-overhead latency."""
section = "admin"
priority = "optional"
# Statically linked (musl) — no dynamic library dependencies to
# auto-detect, and dpkg-shlibdeps isn't available when cross-
# building on a non-Debian host anyway.
depends = ""
maintainer-scripts = "../../deploy/packaging/debian"
assets = [
    ["target/release/fastetcd", "usr/bin/", "755"],
    ["target/release/fastetcd-ctl", "usr/bin/", "755"],
    ["target/release/fastetcd-migrate", "usr/bin/", "755"],
    ["../../deploy/systemd/fastetcd.service", "lib/systemd/system/fastetcd.service", "644"],
    ["../../deploy/systemd/fastetcd.conf.example", "usr/share/doc/fastetcd/fastetcd.conf.example", "644"],
    ["../../README.md", "usr/share/doc/fastetcd/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "fastetcd"
license = "Apache-2.0"
summary = "Rust implementation of the etcd v3 wire protocol"
# Statically linked (musl); nothing to auto-detect.
auto-req = "disabled"
assets = [
    { source = "target/x86_64-unknown-linux-musl/release/fastetcd", dest = "/usr/bin/fastetcd", mode = "755" },
    { source = "target/x86_64-unknown-linux-musl/release/fastetcd-ctl", dest = "/usr/bin/fastetcd-ctl", mode = "755" },
    { source = "target/x86_64-unknown-linux-musl/release/fastetcd-migrate", dest = "/usr/bin/fastetcd-migrate", mode = "755" },
    { source = "deploy/systemd/fastetcd.service", dest = "/usr/lib/systemd/system/fastetcd.service", mode = "644" },
    { source = "deploy/systemd/fastetcd.conf.example", dest = "/usr/share/doc/fastetcd/fastetcd.conf.example", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/fastetcd/README.md", mode = "644", doc = true },
]
# rpm scriptlets (cargo-generate-rpm builds the package directly, it
# does not go through rpmbuild, so %systemd_post-style macros are
# not available — the equivalent shell is inlined here instead).
post_install_script = """
getent group fastetcd >/dev/null || groupadd --system fastetcd
getent passwd fastetcd >/dev/null || useradd --system --gid fastetcd \\
  --home-dir /var/lib/fastetcd --no-create-home --shell /sbin/nologin fastetcd
mkdir -p /var/lib/fastetcd /etc/fastetcd
chown fastetcd:fastetcd /var/lib/fastetcd
systemctl daemon-reload >/dev/null 2>&1 || :
systemctl enable --now fastetcd.service >/dev/null 2>&1 || :
"""
pre_uninstall_script = """
if [ $1 -eq 0 ]; then
  systemctl --no-reload disable --now fastetcd.service >/dev/null 2>&1 || :
fi
"""
post_uninstall_script = """
systemctl daemon-reload >/dev/null 2>&1 || :
if [ $1 -ge 1 ]; then
  systemctl try-restart fastetcd.service >/dev/null 2>&1 || :
fi
"""
